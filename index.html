<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Situação Líquida Patrimonial — Professor Moreira</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081e43;color:#102b50;font-family:Arial,sans-serif} .app{max-width:650px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{padding:15px 20px;color:#fff;font-size:17px;line-height:1.4;display:flex;justify-content:space-between;gap:12px}.bar{height:5px;background:#203d64}.bar span{display:block;height:100%;background:#f4c862;transition:width .2s}main{flex:1;padding:18px 16px 125px}article{background:#f7fbff;border-radius:24px;padding:27px 23px;box-shadow:0 12px 28px #0003}h1{font-size:clamp(37px,9vw,56px);line-height:1.12;margin:22px 0;color:#103c79}h2{font-size:clamp(31px,8vw,43px);line-height:1.15;margin:10px 0 24px}p,li{font-size:clamp(24px,6vw,30px);line-height:1.45}p{margin:18px 0}ul{padding-left:27px}li{margin:16px 0}.tag{font-size:16px;font-weight:bold;letter-spacing:2px;color:#476488;text-transform:uppercase}.box{border-radius:16px;background:#e3efff;padding:18px;margin:22px 0;font-size:clamp(26px,7vw,35px);font-weight:bold;line-height:1.4;text-align:center}.note{border-left:5px solid #e3b84c;padding:14px;background:#fff6db;color:#174c90;font-size:24px;line-height:1.45}.brand{font-size:29px;font-weight:bold;color:#174c90;line-height:1.3}.cover{text-align:center;padding-top:32px;padding-bottom:32px}.cover .symbol{font-size:65px}.good{background:#e0f3e8;color:#155c3b}.bad{background:#ffebeb;color:#a32636}footer{position:fixed;bottom:0;left:0;right:0;background:#081e43;padding:12px 14px max(14px,env(safe-area-inset-bottom));z-index:2}.nav{max-width:618px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}button{border:0;border-radius:14px;min-height:66px;background:#fff;color:#103c79;font-size:18px;font-weight:bold;cursor:pointer}button span{display:block;font-size:28px;line-height:1.1}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:4px solid #f4c862;outline-offset:3px}.start{background:#f4c862;width:100%;margin-top:20px;font-size:24px}.restart{background:#f4c862}.small{font-size:21px;color:#44617f}
</style></head><body><div class="app"><header><span>Professor Moreira<br>Contabilidade</span><span id="count" aria-live="polite"></span></header><div class="bar"><span id="progress"></span></div><main id="main"></main></div><footer><nav class="nav" aria-label="Navegação"><button id="back" aria-label="Voltar à tela anterior"><span>←</span>Voltar</button><button id="reset" class="restart" aria-label="Reiniciar apresentação"><span>↺</span>Reiniciar</button><button id="next" aria-label="Ir para a próxima tela"><span>→</span>Avançar</button></nav></footer>
<script>
const slides=[
['capa','Situação Líquida Patrimonial','<div class="symbol">📘</div><p class="brand">Curso de Contabilidade<br>Professor Moreira</p><p>Mapa textual de estudo</p><p class="small">Conceito • Fórmula • Situações • Exemplos</p><button class="start" onclick="go(1)">Começar →</button>'],
['conceito','O que é situação líquida?','<p>É o valor que resta dos <b>ativos</b> após a dedução de todas as <b>obrigações com terceiros</b>.</p><div class="box">Situação Líquida =<br>Patrimônio Líquido</div><p class="note">Pense assim: dos bens e direitos, subtraímos as dívidas. O resultado é o patrimônio líquido.</p>'],
['elementos','Elementos do patrimônio','<p><b>Ativo (A)</b><br>Bens e direitos.</p><p><b>Passivo (P)</b><br>Obrigações com terceiros.</p><p><b>Patrimônio Líquido (PL)</b><br>Valor residual dos ativos após deduzir os passivos.</p>'],
['fórmula','Equação patrimonial','<div class="box">Ativo =<br>Passivo + PL</div><p>Para encontrar a situação líquida:</p><div class="box">PL = Ativo − Passivo</div><p class="note">Aqui, passivo significa as obrigações com terceiros. Não inclui o PL.</p>'],
['positiva','Situação líquida positiva','<div class="box good">Ativo > Passivo<br>PL > 0</div><p>Os bens e direitos superam as obrigações.</p><p>Ativo: <b>R$ 500.000</b><br>Passivo: <b>R$ 300.000</b></p><div class="box good">PL = R$ 200.000</div>'],
['nula','Situação líquida nula','<div class="box">Ativo = Passivo<br>PL = 0</div><p>Os bens e direitos equivalem às obrigações.</p><p>Ativo: <b>R$ 400.000</b><br>Passivo: <b>R$ 400.000</b></p><div class="box">PL = R$ 0</div>'],
['negativa','Situação líquida negativa','<div class="box bad">Ativo < Passivo<br>PL < 0</div><p>As obrigações superam os bens e direitos.</p><p>Ativo: <b>R$ 250.000</b><br>Passivo: <b>R$ 400.000</b></p><div class="box bad">PL = −R$ 150.000</div><p class="note">Essa situação é chamada de <b>passivo a descoberto</b>.</p>'],
['caso particular','Sem dívidas com terceiros','<p>Quando o ativo é positivo e o passivo é zero:</p><div class="box good">PL = Ativo</div><p>Ativo: <b>R$ 80.000</b><br>Passivo: <b>R$ 0</b><br>PL: <b>R$ 80.000</b></p><p class="note">Situação líquida positiva. Todo o ativo é financiado por capital próprio.</p>'],
['casos particulares','Quando o ativo é zero','<p><b>Passivo positivo:</b></p><div class="box bad">PL = −Passivo</div><p>Ativo zero e passivo de R$ 20.000 → <b>PL de −R$ 20.000.</b></p><p><b>Ativo e passivo zero:</b></p><div class="box">PL = 0<br>Situação líquida nula</div>'],
['variação','Situação aumentativa','<p>O patrimônio líquido <b>aumenta</b> em relação ao período anterior.</p><p>PL anterior: <b>R$ 120.000</b><br>PL atual: <b>R$ 180.000</b></p><div class="box good">Aumento de R$ 60.000</div><p class="note">Pode decorrer de lucros ou de aportes dos sócios.</p>'],
['variação','Situação diminutiva','<p>O patrimônio líquido <b>diminui</b> em relação ao período anterior.</p><p>PL anterior: <b>R$ 180.000</b><br>PL atual: <b>R$ 120.000</b></p><div class="box bad">Redução de R$ 60.000</div><p class="note">Pode decorrer de prejuízos ou de distribuições aos sócios.</p>'],
['atenção','Posição × variação','<p><b>Positiva, nula e negativa:</b><br>Descrevem a situação em uma determinada data.</p><p><b>Aumentativa e diminutiva:</b><br>Descrevem a mudança entre duas datas.</p><p class="note">O PL pode aumentar e continuar negativo: de −R$ 100.000 para −R$ 40.000. Aumento de R$ 60.000!</p>'],
['atenção para a prova','Duas pegadinhas','<p><b>PL positivo não garante dinheiro disponível.</b></p><p>A empresa pode ter ativos em estoques e imóveis, com pouco dinheiro em caixa.</p><p><b>PL nulo não significa ausência de capital social.</b></p><p>Prejuízos acumulados podem compensar o capital e outras contas do PL.</p>'],
['memorize','Resumo final','<div class="box good">Ativo maior que passivo<br>→ Positiva</div><div class="box">Ativo igual ao passivo<br>→ Nula</div><div class="box bad">Ativo menor que passivo<br>→ Negativa</div><div class="box">Sempre: PL = A − P</div>'],
['conclusão','Vamos revisar?','<p>Você concluiu o mapa de <b>Situação Líquida Patrimonial</b>.</p><div class="box">Quem quer ser aprovado<br>estuda!</div><p class="brand">Curso de Contabilidade<br>Professor Moreira</p><button class="start" onclick="go(0)">↺ Reiniciar estudo</button>']
];let current=0;const main=document.getElementById('main'),back=document.getElementById('back'),next=document.getElementById('next');function go(n){current=Math.max(0,Math.min(slides.length-1,n));const s=slides[current];main.innerHTML='<article class="'+(current===0?'cover':'')+'"><div class="tag">'+(current===0?'Contabilidade geral':s[0])+'</div><'+(current===0?'h1':'h2')+'>'+s[1]+'</'+(current===0?'h1':'h2')+'>'+s[2]+'</article>';document.getElementById('count').textContent=(current+1)+' / '+slides.length;document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';back.disabled=current===0;next.disabled=current===slides.length-1;window.scrollTo(0,0)}back.onclick=()=>go(current-1);next.onclick=()=>go(current+1);document.getElementById('reset').onclick=()=>go(0);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key==='Home')go(0)});go(0);
</script></body></html>
